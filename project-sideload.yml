name: StepTrackSideload
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  fileTypes:
    obj:
      buildPhase: resources
      file: true
    mtl:
      buildPhase: resources
      file: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    APP_BUNDLE_ID: com.personal.steptrack.sideload
targets:
  StepTrack:
    type: application
    platform: iOS
    sources:
      - StepTrack/App
      - path: StepTrack/Core
        excludes:
          - "**/.gitkeep"
      - path: StepTrack/Features
        excludes:
          - "**/.gitkeep"
      - StepTrack/Resources/Assets.xcassets
      - path: StepTrack/Resources/Datasets/exercises.json
        type: file
        buildPhase: resources
      - path: StepTrack/Resources/Models3D/human_body.obj
        type: file
        buildPhase: resources
      - path: StepTrack/Resources/Models3D/human_body.mtl
        type: file
        buildPhase: resources
      - StepTrack/Resources/Localization
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) MOTION_ONLY
    info:
      path: StepTrack/Config/Sideload-Info.plist
      properties:
        CFBundleDisplayName: Step Track
        NSMotionUsageDescription: Step Track reads steps and distance from your iPhone's motion sensor.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
  StepTrackTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/UnitTests
    dependencies:
      - target: StepTrack
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tests
  StepsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/StepsTests
    dependencies:
      - target: StepTrack
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).stepstests
  StepTrackUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/UITests
    dependencies:
      - target: StepTrack
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).uitests
        TEST_TARGET_NAME: StepTrack
schemes:
  StepTrack:
    build:
      targets:
        StepTrack: all
    test:
      targets: [StepTrackTests, StepsTests, StepTrackUITests]
