name: StepTrackSideload
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    APP_BUNDLE_ID: com.personal.steptrack.sideload
targets:
  StepTrack:
    type: application
    platform: iOS
    sources:
      - StepTrack/App
      - StepTrack/Shared
      - StepTrack/Assets.xcassets
      - StepTrack/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) MOTION_ONLY
    info:
      path: StepTrack/Config/Sideload-Info.plist
      properties:
        CFBundleDisplayName: Step Track
        NSMotionUsageDescription: Step Track đọc bước chân và quãng đường từ cảm biến iPhone để hiển thị hoạt động của bạn.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
schemes:
  StepTrack:
    build:
      targets:
        StepTrack: all
