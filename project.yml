name: StepTrack
options:
  bundleIdPrefix: com.personal.steptrack
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    APP_BUNDLE_ID: com.personal.steptrack
    APP_GROUP_ID: group.com.personal.steptrack
targets:
  StepTrack:
    type: application
    platform: iOS
    sources:
      - StepTrack/App
      - StepTrack/Shared
      - StepTrack/Assets.xcassets
      - StepTrack/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: StepTrack/Config/Info.plist
      properties:
        CFBundleDisplayName: Step Track
        AppGroupIdentifier: $(APP_GROUP_ID)
        NSHealthShareUsageDescription: Step Track đọc số bước và quãng đường từ Sức khỏe để hiển thị hoạt động và widget của bạn. Dữ liệu chỉ được lưu trên thiết bị.
        NSMotionUsageDescription: Step Track đọc bước chân từ cảm biến chuyển động của iPhone.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: StepTrack/Config/StepTrack.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    dependencies:
      - target: StepTrackWidget
        embed: true
  StepTrackWidget:
    type: app-extension
    platform: iOS
    sources:
      - StepTrack/Widget
      - StepTrack/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widget
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: StepTrack/Config/Widget-Info.plist
      properties:
        CFBundleDisplayName: Step Track
        AppGroupIdentifier: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: StepTrack/Config/Widget.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
  StepTrackTests:
    type: bundle.unit-test
    platform: iOS
    sources: [StepTrack/Tests]
    dependencies:
      - target: StepTrack
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tests
  StepTrackUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [StepTrack/UITests]
    dependencies:
      - target: StepTrack
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).uitests
        TEST_TARGET_NAME: StepTrack
schemes:
  StepTrack:
    build:
      targets:
        StepTrack: all
    test:
      targets: [StepTrackTests, StepTrackUITests]
