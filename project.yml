name: StepTrack
options:
  bundleIdPrefix: com.personal.steptrack
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  fileTypes:
    obj:
      buildPhase: resources
      file: true
    mtl:
      buildPhase: resources
      file: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    APP_BUNDLE_ID: com.personal.steptrack
    APP_GROUP_ID: group.com.personal.steptrack
targets:
  StepTrack:
    type: application
    platform: iOS
    sources:
      - StepTrack/App
      - path: StepTrack/Core
        excludes:
          - "**/.gitkeep"
      - path: StepTrack/Features
        excludes:
          - "**/.gitkeep"
      - StepTrack/Resources/Assets.xcassets
      - path: StepTrack/Resources/Datasets/exercises.json
        type: file
        buildPhase: resources
      - path: StepTrack/Resources/Models3D/human_body.obj
        type: file
        buildPhase: resources
      - path: StepTrack/Resources/Models3D/human_body.mtl
        type: file
        buildPhase: resources
      - StepTrack/Resources/Localization
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: StepTrack/Config/Info.plist
      properties:
        CFBundleDisplayName: Step Track
        AppGroupIdentifier: $(APP_GROUP_ID)
        NSHealthShareUsageDescription: Step Track reads your steps and walking distance to show your activity and widgets. Data stays on your device.
        NSMotionUsageDescription: Step Track reads steps and distance from your iPhone's motion sensor.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: StepTrack/Config/StepTrack.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    dependencies:
      - target: StepTrackWidget
        embed: true
  StepTrackWidget:
    type: app-extension
    platform: iOS
    sources:
      - StepTrack/Widget
      - path: StepTrack/Core/Models/ActivityModels.swift
        type: file
      - path: StepTrack/Core/Persistence/ActivityStorage.swift
        type: file
      - path: StepTrack/Core/Services/CapabilityService.swift
        type: file
      - path: StepTrack/Core/DesignSystem/SvgIcon.swift
        type: file
      - path: StepTrack/Core/DesignSystem/ThemeManager.swift
        type: file
      - StepTrack/Core/Localization
      - path: StepTrack/Resources/Assets.xcassets
        excludes:
          - AppIcon.appiconset
      - StepTrack/Resources/Localization
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widget
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: StepTrack/Config/Widget-Info.plist
      properties:
        CFBundleDisplayName: Step Track
        AppGroupIdentifier: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: StepTrack/Config/Widget.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
  StepTrackTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/UnitTests
    dependencies:
      - target: StepTrack
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tests
  StepsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/StepsTests
    dependencies:
      - target: StepTrack
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).stepstests
  StepTrackUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/UITests
    dependencies:
      - target: StepTrack
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).uitests
        TEST_TARGET_NAME: StepTrack
schemes:
  StepTrack:
    build:
      targets:
        StepTrack: all
    test:
      targets: [StepTrackTests, StepsTests, StepTrackUITests]
